name: Crawl and Post News

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '30 3 * * *'
    - cron: '0 7 * * *'
    - cron: '30 10 * * *'
    - cron: '0 14 * * *'
    - cron: '30 17 * * *'
    - cron: '0 21 * * *'
  
  workflow_dispatch:

jobs:
  crawl-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    # ✅ Đưa env ra job level cho sạch
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # ← nâng cấp v3 → v4

      - name: Setup Node.js
        uses: actions/setup-node@v4   # ← nâng cấp v3 → v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Chromium and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libnss3 \
            libgtk-3-0t64 \
            libxss1 \
            libasound2t64

      - name: Verify Chromium
        run: |
          which chromium
          chromium --version || echo "Chromium not found!"

      - name: Install npm dependencies
        run: npm ci   # ← nên dùng npm ci thay vì npm install trong CI

      - name: Run crawler
        run: node src/index.js